services:
  # Redis para cache
  redis:
    image: redis:7-alpine
    container_name: pvh_redis
    volumes:
      - ./redis_data:/data
    command: redis-server --appendonly yes

  # GeoServer para servir mapas WMS/WFS
  geoserver:
    image: kartoza/geoserver:2.23.0
    container_name: pvh_geoserver
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      GEOSERVER_DATA_DIR: /opt/geoserver/data_dir
      STABLE_EXTENSIONS: "css-plugin,ysld-plugin"
      COMMUNITY_EXTENSIONS: ""
    volumes:
      - ./geoserver_data:/opt/geoserver/data_dir
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/geoserver/web/" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Django Application
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pvh_django
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - REDIS_URL=${REDIS_URL}
      - GEOSERVER_URL=/geoserver
    volumes:
      - ./django_app:/app
      - ./data_source:/app/data_source
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_started

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pvh_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    depends_on:
      - django
      - geoserver

volumes:
  static_volume:
  media_volume:
