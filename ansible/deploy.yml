---
- name: Deploy PVH Geoportal App
  hosts: all
  become: no
  vars:
    app_dir: /srv/servidor_principal/apps/geo_pvh
    repo_dir: /srv/servidor_principal/apps/geo_pvh

  tasks:
    - name: Forçar descarte de alterações locais e puxar código
      ansible.builtin.shell: |
        git reset --hard HEAD
        git pull origin confi_remoto
      args:
        chdir: "{{ repo_dir }}"

    - name: Gerar arquivo .env seguro no servidor
      ansible.builtin.copy:
        content: "{{ lookup('env', 'DOTENV_SECRET') }}"
        dest: "{{ app_dir }}/.env"
        mode: '0600'

    - name: Reconstruir a imagem e subir os containers
      ansible.builtin.shell: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
      args:
        chdir: "{{ app_dir }}"

    - name: Rodar migrações do Banco de Dados
      ansible.builtin.shell: docker exec pvh_django python manage.py migrate
      
    - name: Coletar Arquivos Estáticos (CSS/JS)
      ansible.builtin.shell: docker exec pvh_django python manage.py collectstatic --noinput