services:
  django:
    environment:
      - POSTGRES_HOST=pvh_postgis
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

networks:
  default:
    name: rede_proxy
    external: true